  - evidence_id: C005-EVID-006
    sequence: 6
    source_id: C005_FOUNDER_EVIDENCE_B
    evidence_classification: FOUNDER_CONFIRMED
    temporal_role: CURRENT_INTENT
    domain: PRODUCT_DEMAND
    canonical_owner: PRODUCT_HIERARCHY_VARIANT_RULES
    disposition: EVIDENCE_ONLY
    statement: "201/51 serves installers/executors, builders, reseller/partners and end customers without a dominant segment, for stair railing, balcony guard/railing, guard/handrail, decoration and stainless structures subject to technical review. The exact high-demand thickness set is 0.45, 0.50, 0.55 and 0.60 mm, strongest at 0.45 and 0.50. Sumwin, Sansco, Goldsco, King, StoneLand and SUS all have demand without ranking. Natural glossy demand exceeds glossy gold; natural is mainly 6 m and gold mainly 3 m. Branch/shakheh is the natural order unit."
    promotion_effect: false
    implementation_authority: false
  - evidence_id: C005-EVID-007
    sequence: 7
    source_id: C005_FOUNDER_EVIDENCE_B
    evidence_classification: FOUNDER_CONFIRMED
    temporal_role: CURRENT_INTENT
    domain: MASS_LIFECYCLE
    canonical_owner: C002_MASS_PROVENANCE
    disposition: EVIDENCE_ONLY
    statement: "Incoming loads may have different branch mass; a supplier statement is only an intake source channel, CURRENT remains until exhausted, NEXT_PENDING requires operator promotion, history is retained and no automatic stock-derived mass switch is allowed."
    promotion_effect: false
    implementation_authority: false
  - evidence_id: C005-EVID-008
    sequence: 8
    source_id: C005_FOUNDER_EVIDENCE_B
    evidence_classification: FOUNDER_CONFIRMED
    temporal_role: CURRENT_INTENT
    domain: PRICING_CONTEXT
    canonical_owner: DISCOVERY_BACKLOG_ONLY
    disposition: FUTURE_CONTRACT_INPUT
    statement: "Commercial calculation intent depends on branch quantity, current applicable branch mass and current price per kilogram while operator retains final price authority; price context may differ by Grade, Brand, Size, Thickness, Appearance and Length and must not be inherited without governance."
    promotion_effect: false
    implementation_authority: false
  - evidence_id: C005-EVID-009
    sequence: 9
    source_id: C005_FOUNDER_EVIDENCE_C
    evidence_classification: FOUNDER_CONFIRMED
    temporal_role: CURRENT_INTENT
    domain: PRICING_CHANGE_CONTROL
    canonical_owner: DISCOVERY_BACKLOG_ONLY
    disposition: FUTURE_CONTRACT_INPUT
    statement: "Future pricing administration requires operator-controlled Bulk Price Adjustment and single-combination override; fixed and percentage increases/decreases; pre-apply scope/old/new preview; optional arbitrary rounding step with up/down/nearest modes; exclusions/locks; audit of old/new price, time, operator, Bulk/Single, scope, rounding, lock/exclusion and internal reason; history-preserving rollback; operator authority without second approval; scheduled activation editable/cancellable before execution and rollback afterward; and conflict detection with operator-decided precedence. No current price or price engine is created."
    promotion_effect: false
    implementation_authority: false
  - evidence_id: C005-EVID-010
    sequence: 10
    source_id: C005_FOUNDER_EVIDENCE_C
    evidence_classification: FOUNDER_CONFIRMED
    temporal_role: CURRENT_INTENT
    domain: PRIVATE_PRICING
    canonical_owner: INQUIRY_CUSTOMER_MODEL
    disposition: FUTURE_CONTRACT_INPUT
    statement: "Future private pricing distinguishes ordinary, reseller/partner, wholesale and special/private groups; groups are extensible, and a customer-specific price may override group/base context with start/end validity, internal reason and lower-layer fallback after expiry. Authorized UX shows the real/reference price struck through plus «قیمت برای شما», without a percentage/savings badge. It must not leak to public SEO, shared cache, structured data or another customer and creates no customer record, price, checkout or Runtime behavior in C005."
    promotion_effect: false
    implementation_authority: false
  - evidence_id: C005-EVID-011
    sequence: 11
    source_id: C005_FOUNDER_EVIDENCE_D
    evidence_classification: FOUNDER_CONFIRMED
    temporal_role: CURRENT_INTENT
    domain: VIP_LOYALTY
    canonical_owner: INQUIRY_CUSTOMER_MODEL
    disposition: FUTURE_CONTRACT_INPUT
    statement: "VIP/Private Customer is a time-bound, multi-tier-ready configurable entitlement. Operator can promote/demote, extend/cancel it and retained history is required. Loyalty Points, VIP Tier and Commercial Benefits remain separate; VIP alone creates no automatic discount, credit or payment privilege."
    promotion_effect: false
    implementation_authority: false
  - evidence_id: C005-EVID-012
    sequence: 12
    source_id: C005_FOUNDER_EVIDENCE_D
    evidence_classification: FOUNDER_CONFIRMED
    temporal_role: FUTURE_CAPABILITY
    domain: VIP_LOYALTY_FUTURE
    canonical_owner: INQUIRY_CUSTOMER_MODEL
    disposition: FUTURE_CONTRACT_INPUT
    statement: "Future capabilities may suggest VIP promotion/demotion from sales or points, but final application remains operator-approved; points may arise from purchases, referrals, on-time payment, periodic volume, campaigns and future sources; redemption is operator-controlled; expiry supports permanent, annual and operator-defined periods; timed VIP may be awarded or sold. Initial planned notifications are in-account plus SMS, with plugin-ready later channels. No Phase-1 activation is granted."
    promotion_effect: false
    implementation_authority: false
  - evidence_id: C005-EVID-013
    sequence: 13
    source_id: C005_FOUNDER_EVIDENCE_D
    evidence_classification: FOUNDER_CONFIRMED
    temporal_role: CURRENT_INTENT
    domain: ORDER_CUT_SHIPPING
    canonical_owner: DISCOVERY_BACKLOG_ONLY
    disposition: FUTURE_CONTRACT_INPUT
    statement: "Minimum order may be one full branch. Requested cutting carries a separate operator-controlled service charge outside Product Truth. Shipping is separate from product price and operator selects/finalizes method and cost by load and distance. Reservation duration is operator-defined and does not necessarily lock price; price validity is separate and operator may update price before payment. True order mismatch supports follow-up/correction/exchange; preference returns are case-by-case; cut/customized goods are stricter and final return decisions remain operator-controlled."
    promotion_effect: false
    implementation_authority: false
  - evidence_id: C005-EVID-014
    sequence: 14
    source_id: C005_FOUNDER_EVIDENCE_D
    evidence_classification: FOUNDER_CONFIRMED
    temporal_role: CURRENT_INTENT
    domain: ORDER_WORKFLOW
    canonical_owner: INQUIRY_CUSTOMER_MODEL
    disposition: FUTURE_CONTRACT_INPUT
    statement: "Before dispatch, operator may amend quantity, product, cutting, shipping and other details with before/after history. Phone, in-person or messaging orders may be entered by operator into one system; inquiry/order may start without login and later be linked to an account. Quotations/pro-forma have defined validity and may be revised, cancelled or converted to an order with version history. Internal customer/order notes remain private. These requirements create no Customer or Order objects in C005."
    promotion_effect: false
    implementation_authority: false
  - evidence_id: C005-EVID-015
    sequence: 15
    source_id: C005_FOUNDER_EVIDENCE_B
    evidence_classification: ARCHITECTURE_PROPOSAL
    temporal_role: PLANNING_ONLY
    domain: IMPLEMENTATION_MECHANICS
    canonical_owner: DISCOVERY_BACKLOG_ONLY
    disposition: ARCHITECTURE_PROPOSAL_ONLY
    statement: "The exact retained-history storage mechanism for load Mass remains an architecture proposal requiring a separately authorized contract; Founder evidence fixes history retention, not its implementation."
    promotion_effect: false
