anti_patterns:
  - anti_pattern_id: "canti:000000000001"
    competitor_example: "Steel Majlesi and other broad catalogs"
    evidence_refs: ["cobs:000000000001"]
    observed_problem: "Customer navigation exposes very deep taxonomies at once."
    architectural_risk: "Customer-facing menus become a parallel hierarchy and pages fragment."
    ux_business_impact: "High cognitive load, poor mobile discovery and maintenance cost."
    damavand_prevention_rule: "Keep canonical breadth in data; expose task-oriented progressive routes."
  - anti_pattern_id: "canti:000000000002"
    competitor_example: "Multiple competitor page-per-combination models"
    evidence_refs: ["cobs:000000000001", "cobs:000000000013"]
    observed_problem: "Each arbitrary combination receives a separate thin commercial page."
    architectural_risk: "Product truth and SEO intent duplicate across URLs."
    ux_business_impact: "Cannibalization, stale pages and inconsistent updates."
    damavand_prevention_rule: "Create only evidence-backed intent owners and keep variants under one governed family."
  - anti_pattern_id: "canti:000000000003"
    competitor_example: "Steel Sheet placeholder surfaces"
    evidence_refs: ["cobs:00000000000f"]
    observed_problem: "Incomplete descriptions and zero-price states reach the public catalog."
    architectural_risk: "Publication becomes decoupled from completeness and commercial state."
    ux_business_impact: "Trust loss and misleading purchase cues."
    damavand_prevention_rule: "Fail publication unless content and commercial-state gates pass."
  - anti_pattern_id: "canti:000000000004"
    competitor_example: "SteelParto public store state"
    evidence_refs: ["cobs:000000000030"]
    observed_problem: "Stock boolean, stock text, price and purchasability disagree."
    architectural_risk: "Commercial truth fields diverge across projections."
    ux_business_impact: "Customers receive contradictory promises."
    damavand_prevention_rule: "Project one fail-closed state assembled from separately governed truth domains."
  - anti_pattern_id: "canti:000000000005"
    competitor_example: "Saba Profile and broad marketplaces"
    evidence_refs: ["cobs:00000000002a"]
    observed_problem: "Old commercial values or warehouse-like labels remain visible."
    architectural_risk: "Stale evidence is treated as current Availability or price."
    ux_business_impact: "False urgency, bad quotes and reputational risk."
    damavand_prevention_rule: "Require source, observed-at, validity and operator verification for every commercial claim."
  - anti_pattern_id: "canti:000000000006"
    competitor_example: "Kia Steel and Sam Steel mixed states"
    evidence_refs: ["cobs:000000000011", "cobs:000000000014"]
    observed_problem: "Range, zero, inquiry and cart semantics coexist without an explicit state model."
    architectural_risk: "UI controls imply authority that the underlying data does not have."
    ux_business_impact: "Dead ends and accidental checkout expectations."
    damavand_prevention_rule: "Use explicit inquiry-first and future per-SKU eligibility states."
  - anti_pattern_id: "canti:000000000007"
    competitor_example: "SteelRokh dense tables"
    evidence_refs: ["cobs:00000000000a"]
    observed_problem: "Very dense tables become the primary selection interface."
    architectural_risk: "Desktop information architecture is projected directly to mobile."
    ux_business_impact: "Slow scanning and error-prone selection."
    damavand_prevention_rule: "Preserve depth behind progressive family selection and accessible detail views."
  - anti_pattern_id: "canti:000000000008"
    competitor_example: "Competitor technical and commercial pages"
    evidence_refs: ["cobs:00000000000c", "cobs:000000000012"]
    observed_problem: "Long repeated educational text is embedded in many Product pages."
    architectural_risk: "Knowledge and Product intent owners collapse."
    ux_business_impact: "Duplication, stale content and keyword cannibalization."
    damavand_prevention_rule: "Own knowledge once and connect it to commercial pages with governed links."
  - anti_pattern_id: "canti:000000000009"
    competitor_example: "Generic WooCommerce variable catalogs"
    evidence_refs: ["cobs:000000000007", "cobs:000000000013"]
    observed_problem: "Variation controls may expose unsupported combinations."
    architectural_risk: "Runtime options become an uncontrolled substitute for Variant Rules."
    ux_business_impact: "Impossible orders and admin sprawl."
    damavand_prevention_rule: "Generate selectable states only from evidence-backed Variant Rules."
  - anti_pattern_id: "canti:00000000000a"
    competitor_example: "Public competitor stock patterns"
    evidence_refs: ["cobs:000000000003", "cobs:00000000002a", "cobs:000000000030"]
    observed_problem: "Exact stock or availability language appears without inspectable provenance."
    architectural_risk: "Presentation can outrun inventory and supply evidence."
    ux_business_impact: "Broken promises and operational escalation."
    damavand_prevention_rule: "Never claim stock; preserve internal supply-state distinctions and operator verification."
  - anti_pattern_id: "canti:00000000000b"
    competitor_example: "Competitor descriptions and branded media"
    evidence_refs: ["cobs:00000000000c"]
    observed_problem: "Market research can tempt direct reuse of prose, tables or images."
    architectural_risk: "Copyright and source provenance are lost."
    ux_business_impact: "Legal risk and undifferentiated content."
    damavand_prevention_rule: "Capture only abstract structures and create original, authoritative Damavand content."
  - anti_pattern_id: "canti:00000000000c"
    competitor_example: "Broad desktop-first mega-menus"
    evidence_refs: ["cobs:000000000001", "cobs:000000000016"]
    observed_problem: "All categories and options are exposed before customer context is known."
    architectural_risk: "Navigation ignores the canonical dependency order."
    ux_business_impact: "Mobile overload and abandoned discovery."
    damavand_prevention_rule: "Ask only the next valid question in a Mobile First Persian RTL flow."
